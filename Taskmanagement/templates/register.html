<!DOCTYPE html>
<html>
<head>
    <title>Register - Task Management</title>
</head>
<body>
    <h1>Task Management System</h1>
    <h2>Create Account</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Username</label>
        <br>
        <input
            type="text"
            name="username"
            required
        >
        <br><br>

        <label>Email</label>
        <br>
        <input
            type="email"
            name="email"
        >

        <br><br>

        <label>Password</label>
        <br>
        <input
            type="password"
            name="password"
            required
        >

        <br><br>

        <button type="submit">
            Register
        </button>

    </form>

    <p>
        Already have an account?
        <a href="/login/">Login</a>
    </p>

</body>
</html>
