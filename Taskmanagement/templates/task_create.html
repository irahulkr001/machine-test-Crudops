<!DOCTYPE html>
<html>
<head>
    <title>Add Task</title>
</head>
<body>
    <h1>Task Management System</h1>
    <nav>

    <a href="/task/">
        Dashboard
    </a>

    |

    <a href="/logout/">
        Logout
    </a>

</nav>

<hr>
    <h2>Add New Task</h2>
    {% if error %}
        <p>{{ error }}</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <label>Title</label>
        <br>
        <input
            type="text"
            name="title"
            required
        >
        <br><br>
        <label>Description</label>
        <br>
        <textarea
            name="description"
            rows="5"
            cols="40"
        ></textarea>
        <br><br>
        <label>Status</label>
        <br>
        <select name="status">
            <option value="Todo">
                Todo
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Completed">
                Completed
            </option>

        </select>

        <br><br>


        <label>Priority</label>
        <br>

        <select name="priority">

            <option value="Low">
                Low
            </option>

            <option value="Medium" selected>
                Medium
            </option>

            <option value="High">
                High
            </option>

        </select>

        <br><br>


        <label>Due Date</label>
        <br>

        <input
            type="date"
            name="due_date"
        >

        <br><br>


        <button type="submit">
            Save Task
        </button>

    </form>

    <br>

    <a href="/task/">
        Back to Dashboard
    </a>

</body>
</html>
