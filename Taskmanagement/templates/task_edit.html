<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
</head>
<body>
    <h1>Task Management System</h1>
    <nav>

    <a href="/task/">
        Dashboard
    </a>

    |

    <a href="/task/create/">
        Add Task
    </a>

    |

    <a href="/logout/">
        Logout
    </a>

</nav>

<hr>
    <h2>Edit Task</h2>
    <form method="post">
        {% csrf_token %}
        <label>Title</label>
        <br>
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
            required
        >
        <br><br>
        <label>Description</label>
        <br>
        <textarea
            name="description"
            rows="5"
            cols="40"
        >{{ task.description }}</textarea>
        <br><br>
        <label>Status</label>
        <br>
        <select name="status">
            <option
                value="Todo"
                {% if task.status == 'Todo' %}selected{% endif %}
            >
                Todo
            </option>
            <option
                value="In Progress"
                {% if task.status == 'In Progress' %}selected{% endif %}
            >
                In Progress
            </option>

            <option
                value="Completed"
                {% if task.status == 'Completed' %}selected{% endif %}
            >
                Completed
            </option>

        </select>

        <br><br>


        <label>Priority</label>
        <br>

        <select name="priority">

            <option
                value="Low"
                {% if task.priority == 'Low' %}selected{% endif %}
            >
                Low
            </option>

            <option
                value="Medium"
                {% if task.priority == 'Medium' %}selected{% endif %}
            >
                Medium
            </option>

            <option
                value="High"
                {% if task.priority == 'High' %}selected{% endif %}
            >
                High
            </option>

        </select>

        <br><br>


        <label>Due Date</label>
        <br>

        <input
            type="date"
            name="due_date"
            value="{{ task.due_date|date:'Y-m-d' }}"
        >

        <br><br>


        <button type="submit">
            Update Task
        </button>

    </form>

    <br>

    <a href="/task/">
        Back to Dashboard
    </a>
</body>
</html>
